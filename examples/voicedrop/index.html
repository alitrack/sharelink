<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>voice drop — 异步对讲机 · ShareLink 零知识示例</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0a0e14;color:#7de0ff;font:14px/1.5 ui-monospace,Consolas,monospace;display:flex;justify-content:center}
#app{width:100%;max-width:660px;padding:16px}
.disclaimer{border:1px solid #5a3b00;background:#1a1206;color:#ffb454;font-size:12px;padding:8px;border-radius:4px}
h1{font-size:18px;margin:12px 0 2px;letter-spacing:2px}
h1 .cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#status{color:#3f7f9f;font-size:12px;min-height:18px;margin-bottom:8px}
fieldset{border:1px solid #1f3d4d;margin:0 0 10px;padding:8px 10px}
legend{padding:0 6px;color:#3f7f9f;font-size:12px}
label{display:block;font-size:12px;color:#3f7f9f}
input{background:#0d151e;border:1px solid #1f3d4d;color:#7de0ff;padding:5px 8px;width:100%;font:inherit;border-radius:3px}
#msgs{border:1px solid #1f3d4d;min-height:300px;padding:10px;background:#07100e;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:6px 10px;border-radius:8px}
.msg .who{font-size:10px;color:#3f7f9f;display:block;margin-bottom:4px}
.msg audio{width:100%;height:36px}
.mine{align-self:flex-end;border:1px solid #1f5d6d;background:#0d242c}
.theirs{align-self:flex-start;border:1px solid #4d3a1f;background:#201808}
.row{display:flex;gap:8px;margin-top:12px;align-items:center}
#talk{flex:1;font-size:16px;padding:16px;background:#0d2c24;border:2px solid #1f6d4f;color:#7dff9b;letter-spacing:3px}
#talk.rec{background:#3a0d0d;border-color:#802020;color:#ff9b9b;animation:blink 1s steps(1) infinite}
#burn{background:#240d0d;border:1px solid #6d1f1f;color:#ff9b9b;padding:14px}
.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#3a0d0d;border:1px solid #802020;color:#ff9b9b;padding:8px 16px;border-radius:4px;z-index:9}
</style>
</head>
<body>
<div id="app">
  <div class="disclaimer">⚠️ 零知识架构演示：无 Forward Secrecy、无元数据混淆。语音经 SL1 信封端到端加密，服务端只见密文。</div>
  <h1>VOICE DROP<span class="cur">▌</span></h1>
  <div id="status">初始化…</div>
  <fieldset>
    <legend>配置（约定密码 = 频道号，通过可信渠道传递；角色由链接 #A / #B 决定）</legend>
    <label>服务端 <input id="base" value="http://127.0.0.1:8098"></label>
    <label>Namespace <input id="ns" value="voicedrop" style="max-width:140px"></label>
    <label>约定密码 <input id="pass" type="password" autocomplete="off" placeholder="passphrase"></label>
  </fieldset>
  <div id="msgs"></div>
  <div class="row">
    <button id="talk">● TALK（点按说话，再点发送）</button>
    <button id="burn">BURN</button>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
